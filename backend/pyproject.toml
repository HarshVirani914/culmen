[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chat-downloader>=0.2.8",
    "fastapi>=0.165.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "openai>=3.55.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.10.26",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
